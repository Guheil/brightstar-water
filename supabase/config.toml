# Authentication settings mirrored from the hosted Supabase project.
# For the hosted project, also set Email OTP length to 6 in the Supabase Dashboard.

[auth.email]
otp_length = 6
otp_expiry = 3600
# Keep the normal client-side email-change flow strict. The thesis-only
# login-email change route uses a server-only admin update after verifying the
# signed-in user's current password, so fake inboxes never need confirmation.
double_confirm_changes = true
secure_password_change = true

# Product photos are public storefront assets. Browser clients never upload
# directly; the protected Admin API writes validated, server-reencoded WebP files.
[storage.buckets.product-images]
public = true
file_size_limit = "512KB"
allowed_mime_types = ["image/webp"]
